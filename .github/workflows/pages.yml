name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCb0Kq_KQouHQSlN4-fQdlLjIqIdM70ups"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "rtd-2026-dashboard.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "rtd-2026-dashboard"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "rtd-2026-dashboard.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "965601362778"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:965601362778:web:a82c7c0a5368c63279e963"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-R1FJQW22EL"
          NEXT_PUBLIC_DATA_API_URL: "https://script.google.com/macros/s/AKfycbyswHdlGPsg2X2ATZZeImOtdM9__gG87tCS3C6-h5_nQ6EuqolfJUIxGQi3vBioWpHM/exec"

      - name: Disable Jekyll
        shell: bash
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
